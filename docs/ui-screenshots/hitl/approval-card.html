<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>TAH-84 HITL 承認カード</title>
    <style>
      :root {
        --page: #121712;
        --surface: #141d14;
        --ink: #c9c9c9;
        --ink-2: #9aa19a;
        --ink-3: #6d746d;
        --orange: #d89a3a;
        --orange-tint: rgba(216, 154, 58, 0.16);
        --green: #0ab320;
        --green-tint: rgba(10, 179, 32, 0.16);
        --red: #d14b4b;
        --red-tint: rgba(209, 75, 75, 0.16);
        --btn: #077015;
        --line: #0e9c2d55;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          13px/1.45 "Noto Sans CJK JP",
          "WenQuanYi Micro Hei",
          sans-serif;
      }
      main {
        display: grid;
        gap: 20px;
        max-width: 420px;
        margin: 32px auto;
        padding: 0 16px 40px;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
      }
      article {
        background: var(--surface);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      header {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      h3 {
        margin: 0;
        font-size: 12.5px;
      }
      p {
        margin: 6px 0 0;
        color: var(--ink-2);
        font-size: 12px;
      }
      .mono {
        color: var(--ink-3);
        font:
          11px/1.5 "Noto Sans Mono CJK JP",
          ui-monospace,
          monospace;
        word-break: break-all;
        margin: 8px 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .pending {
        color: var(--orange);
        background: var(--orange-tint);
      }
      .approved {
        color: var(--green);
        background: var(--green-tint);
      }
      .rejected {
        color: var(--red);
        background: var(--red-tint);
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        border: 0;
        border-radius: 999px;
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
        color: #fff;
      }
      .go {
        background: var(--btn);
      }
      .no {
        background: var(--red-tint);
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>書き込みの確認カード</h1>
      <article data-hitl-status="pending">
        <header>
          <div>
            <h3>
              Linear の課題を作成
              <span class="pill pending"
                ><span class="dot"></span>確認待ち</span
              >
            </h3>
            <p>この操作は承認するまで実行しません。</p>
          </div>
        </header>
        <p class="mono">title=確認カードの試用 · teamId=demo</p>
        <div class="row">
          <button class="go" type="button">承認して実行</button>
          <button class="no" type="button">拒否する</button>
        </div>
      </article>
      <article data-hitl-status="approved">
        <header>
          <div>
            <h3>
              Linear の課題を作成
              <span class="pill approved"
                ><span class="dot"></span>承認済み</span
              >
            </h3>
            <p>承認しました。試用のためツールは実行していません。</p>
          </div>
        </header>
        <p class="mono">title=確認カードの試用 · teamId=demo</p>
      </article>
      <article data-hitl-status="rejected">
        <header>
          <div>
            <h3>
              Linear の課題を作成
              <span class="pill rejected"><span class="dot"></span>拒否</span>
            </h3>
            <p>拒否しました。実行していません。</p>
          </div>
        </header>
        <p class="mono">title=確認カードの試用 · teamId=demo</p>
      </article>
    </main>
  </body>
</html>
