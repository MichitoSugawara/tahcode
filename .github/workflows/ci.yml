name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Ultracite
        run: npm run check

      - name: Convex ESLint
        run: npm run lint:convex

      # `npm run typecheck` needs `convex/_generated` from `npx convex dev`.
      # That codegen is not available on PRs without deploy keys, so CI keeps
      # the local script and does not fail the gate on missing generated types.

      - name: Test
        run: npm test
