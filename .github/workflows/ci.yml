name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Ultracite
        run: npm run check

      - name: Convex ESLint
        run: npm run lint:convex

      # Offline codegen writes convex/_generated so typecheck and convex-test
      # can run without a deploy key (`npm run typecheck` / `npm test` do this).

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
