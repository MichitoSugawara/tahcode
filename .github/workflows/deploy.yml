name: Deploy

on:
  pull_request:
  push:
    branches: [production, staging]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Convex + Cloudflare preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.cloudflare_url }}
    env:
      DOTENV_PRIVATE_KEY_PREVIEW: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Derive preview name
        id: meta
        run: |
          raw="${{ github.head_ref }}"
          name=$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-40)
          if [ -z "$name" ]; then
            name="pr-${{ github.event.number }}"
          fi
          echo "preview_name=$name" >> "$GITHUB_OUTPUT"
          echo "Using Convex preview name: $name"

      - id: deploy
        uses: ./.github/actions/deploy-stack
        with:
          name: preview
          dotenv_file: .env.preview
          wrangler_args: versions upload --env preview --preview-alias pr-${{ github.event.number }}
          preview_name: ${{ steps.meta.outputs.preview_name }}
          convex_env_extra: --preview-name ${{ steps.meta.outputs.preview_name }}

      - name: Comment preview URLs on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const cloudflareUrl = '${{ steps.deploy.outputs.cloudflare_url }}';
            const convexUrl = process.env.CONVEX_URL || '';
            const marker = '<!-- convex-cloudflare-preview -->';
            const body = [
              marker,
              '## Preview deployments',
              '',
              `- Cloudflare: ${cloudflareUrl}`,
              convexUrl ? `- Convex: ${convexUrl}` : null,
              '',
              'These URLs are rebuilt on each push to this PR. Staging and production are not updated.',
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    name: Convex + Cloudflare staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.cloudflare_url }}
    env:
      DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy-stack
        with:
          name: staging
          dotenv_file: .env.staging
          wrangler_args: deploy --env staging

      - name: Publish staging URL
        env:
          CLOUDFLARE_URL: ${{ steps.deploy.outputs.cloudflare_url }}
          CONVEX_URL: ${{ env.CONVEX_URL }}
        run: node scripts/write-deploy-summary.mjs staging

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    name: Convex + Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.cloudflare_url }}
    env:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy-stack
        with:
          name: production
          dotenv_file: .env.production
          wrangler_args: deploy --env=""
          convex_env_extra: --prod

      - name: Publish production URL
        env:
          CLOUDFLARE_URL: ${{ steps.deploy.outputs.cloudflare_url }}
          CONVEX_URL: ${{ env.CONVEX_URL }}
        run: node scripts/write-deploy-summary.mjs production
