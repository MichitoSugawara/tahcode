name: Deploy

on:
  pull_request:
  push:
    branches: [production, staging]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Convex + Cloudflare preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.cloudflare_url }}
    env:
      DOTENV_PRIVATE_KEY_PREVIEW: ${{ secrets.DOTENV_PRIVATE_KEY_PREVIEW }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Derive preview name
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable per-PR name. Unique branch slugs (cursor-…-40chars) each
          # create a Convex preview and hit the team quota of 40.
          name="pr-${{ github.event.number }}"
          echo "preview_name=$name" >> "$GITHUB_OUTPUT"

          fallbacks=$(gh pr list --state merged --limit 30 --json headRefName \
            --jq '[.[].headRefName] | join(",")' || true)
          echo "preview_fallbacks=$fallbacks" >> "$GITHUB_OUTPUT"

          exclude=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.number != ${{ github.event.number }}) | .headRefName, "pr-\(.number)"] | join(",")' \
            || true)
          echo "preview_exclude=$exclude" >> "$GITHUB_OUTPUT"
          echo "Using Convex preview name: $name (fallbacks from recently merged PRs)"

      # Preview-only: deploy-stack lists/creates team-harness-files-preview
      # when credentials allow, then retries transient Wrangler `fetch failed`.
      # Convex: claim pr-<n>, or reuse an existing preview if the quota is full.
      - id: deploy
        uses: ./.github/actions/deploy-stack
        with:
          name: preview
          dotenv_file: .env.preview
          wrangler_args: versions upload --env preview --preview-alias pr-${{ github.event.number }}
          preview_name: ${{ steps.meta.outputs.preview_name }}
          preview_fallbacks: ${{ steps.meta.outputs.preview_fallbacks }}
          preview_exclude: ${{ steps.meta.outputs.preview_exclude }}
          convex_env_extra: --preview-name ${{ steps.meta.outputs.preview_name }}

      - name: Comment preview URLs on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const cloudflareUrl = '${{ steps.deploy.outputs.cloudflare_url }}';
            const skipped = '${{ steps.deploy.outputs.skipped }}';
            const skipReason = '${{ steps.deploy.outputs.skip_reason }}';
            const convexUrl = process.env.CONVEX_URL || '';
            const marker = '<!-- convex-cloudflare-preview -->';
            const cloudflareLine =
              skipped === 'true'
                ? `- Cloudflare: skipped (${skipReason || 'see deploy logs'})`
                : `- Cloudflare: ${cloudflareUrl}`;
            const body = [
              marker,
              '## Preview deployments',
              '',
              cloudflareLine,
              convexUrl ? `- Convex: ${convexUrl}` : null,
              '',
              'These URLs are rebuilt on each push to this PR. Staging and production are not updated.',
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    name: Convex + Cloudflare staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.cloudflare_url }}
    env:
      DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy-stack
        with:
          name: staging
          dotenv_file: .env.staging
          wrangler_args: deploy --env staging

      - name: Publish staging URL
        env:
          CLOUDFLARE_URL: ${{ steps.deploy.outputs.cloudflare_url }}
          CONVEX_URL: ${{ env.CONVEX_URL }}
        run: node scripts/write-deploy-summary.mjs staging

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    name: Convex + Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.cloudflare_url }}
    env:
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy-stack
        with:
          name: production
          dotenv_file: .env.production
          wrangler_args: deploy --env=""
          convex_env_extra: --prod

      - name: Publish production URL
        env:
          CLOUDFLARE_URL: ${{ steps.deploy.outputs.cloudflare_url }}
          CONVEX_URL: ${{ env.CONVEX_URL }}
        run: node scripts/write-deploy-summary.mjs production
