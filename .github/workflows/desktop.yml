name: Desktop

# The Electron shell (apps/desktop) and the shared package it consumes
# (packages/core) are verified independently of the Convex + Cloudflare deploy
# (deploy.yml). Linux checks every PR; the macOS .dmg is produced on demand
# (workflow_dispatch) or on a `desktop-v*` tag so it never consumes macOS
# minutes unexpectedly. Both jobs install from the single root lockfile
# (npm workspaces); Electron's binary is fetched lazily on first run.

# INFRA PAUSED 2026-10-13 — automatic PR/push/tag desktop jobs disabled.
# See docs/infra-pause.md. Restore pull_request, push, and desktop-v* tags
# when lifting the pause.
on:
  workflow_dispatch:
    inputs:
      build_mac:
        description: Build the macOS (Apple Silicon) .dmg. Signed+notarized when all five Developer ID secrets are set; otherwise unsigned (job stays green)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-check:
    name: Typecheck, smoke-run and package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Typecheck shared package and shell
        run: |
          npx tsc -p packages/core/tsconfig.json --noEmit
          npm run typecheck -w @tahcode/desktop

      - name: Unit tests (includes the deep-link / redirect contract)
        run: npm test

      - name: Build main + preload (electron-vite)
        run: npm run build -w @tahcode/desktop

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Smoke-run the shell (loads production, takes a screenshot)
        run: node apps/desktop/scripts/smoke.mjs apps/desktop/release/smoke-production.png

      - name: Smoke-run the OAuth return path (simulated tahcode:// callback)
        env:
          TAHCODE_DESKTOP_SMOKE_DEEP_LINK: "tahcode://auth/callback?next=%2Finvite%2Fci&code=ci-smoke"
        run: node apps/desktop/scripts/smoke.mjs apps/desktop/release/smoke-deeplink.png

      - name: Smoke-run the offline fallback
        run: node apps/desktop/scripts/smoke.mjs apps/desktop/release/smoke-offline.png --url=http://127.0.0.1:45999

      - name: Package (linux dir target validates electron-builder config)
        run: npx electron-builder --linux dir --projectDir apps/desktop --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-smoke
          path: apps/desktop/release/smoke-*.png
          if-no-files-found: error

  mac-dmg:
    name: Build macOS .dmg (Apple Silicon)
    if: github.event_name == 'workflow_dispatch' && inputs.build_mac || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: macos-latest
    timeout-minutes: 60
    # Installers publish to the public MichitoSugawara/tahcode-releases repo via
    # TAHCODE_RELEASES_GITHUB_TOKEN (not this workflow's GITHUB_TOKEN, which
    # cannot write another repository). The private source repo stays read-only.
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck -w @tahcode/desktop

      - name: Require desktop-v tag to match package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag desktop-v${tag} does not match apps/desktop version ${version}"
            exit 1
          fi

      # Fine-grained PAT on tahcode-releases (Contents: write). Repository
      # secret on this private source repo — never embed the value in the app.
      - name: Require token to publish installers to tahcode-releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          TAHCODE_RELEASES_GITHUB_TOKEN: ${{ secrets.TAHCODE_RELEASES_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAHCODE_RELEASES_GITHUB_TOKEN}" ]; then
            echo "Missing TAHCODE_RELEASES_GITHUB_TOKEN."
            echo "Create a fine-grained PAT with Contents: write on MichitoSugawara/tahcode-releases"
            echo "and add it as a repository secret on MichitoSugawara/tahcode."
            exit 1
          fi

      # Required repository secrets for signed+notarized builds (all five).
      # Partial set → unsigned fallback; the job must not fail.
      #   CSC_LINK                     base64 or file:// of Developer ID Application .p12
      #   CSC_KEY_PASSWORD             password for that .p12
      #   APPLE_ID                     Apple ID email used for notarytool
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (not the Apple ID password)
      #   APPLE_TEAM_ID                10-character Team ID
      # Full Mac checklist (CSR → Developer ID Application → .p12 →
      # app-specific password → these five secrets):
      # apps/desktop/README.md 「署名と公証」
      # https://www.electron.build/code-signing / https://www.electron.build/mac
      - name: Detect Developer ID + notarization secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/desktop-signing.mjs --detect-ci

      - name: Build signed + notarized .dmg / .zip
        if: steps.signing.outputs.signed == 'true'
        env:
          TAHCODE_DESKTOP_SIGNED: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.TAHCODE_RELEASES_GITHUB_TOKEN }}
        run: |
          npm run build -w @tahcode/desktop
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            node apps/desktop/scripts/run-electron-builder.mjs --mac dmg zip --arm64 --projectDir apps/desktop --publish always -c.publish.tag="${GITHUB_REF_NAME}"
          else
            node apps/desktop/scripts/run-electron-builder.mjs --mac dmg zip --arm64 --projectDir apps/desktop --publish never
          fi

      - name: Build unsigned .dmg / .zip
        if: steps.signing.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.TAHCODE_RELEASES_GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            npm run build -w @tahcode/desktop
            node apps/desktop/scripts/run-electron-builder.mjs --mac dmg zip --arm64 --projectDir apps/desktop --publish always -c.publish.tag="${GITHUB_REF_NAME}"
          else
            npm run dist:mac -w @tahcode/desktop
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tahcode-desktop-mac-arm64-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
