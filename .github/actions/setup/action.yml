name: Setup
description: Install Node and dependencies from package-lock.json

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "22.20.0"
        cache: npm

    - name: Show Node version
      shell: bash
      run: node -v && npm -v

    - name: Install dependencies
      shell: bash
      run: npm ci --legacy-peer-deps
