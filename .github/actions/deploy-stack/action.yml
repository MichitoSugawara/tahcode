name: Deploy stack
description: Decrypt env, deploy Convex and Cloudflare, then sync Convex Auth env

inputs:
  name:
    required: true
    description: preview, staging, or production
  dotenv_file:
    required: true
  wrangler_args:
    required: true
    description: Arguments after wrangler, e.g. deploy --env staging
  preview_name:
    required: false
    default: ""
  convex_env_extra:
    required: false
    default: ""
    description: Deployment selector for convex env set, e.g. --prod or --preview-name foo (--deployment is rejected when CONVEX_DEPLOY_KEY is set)

outputs:
  cloudflare_url:
    description: Deployed Cloudflare URL
    value: ${{ steps.cf.outputs.cloudflare_url }}

runs:
  using: composite
  steps:
    - name: Decrypt env
      shell: bash
      run: node scripts/env.mjs decrypt ${{ inputs.name }}

    - name: Mask decrypted secrets
      shell: bash
      run: node scripts/mask-env.mjs ${{ inputs.dotenv_file }}

    - name: Deploy Convex and build the Worker
      shell: bash
      run: |
        extra=()
        if [ -n "${{ inputs.preview_name }}" ]; then
          extra+=(--preview-name "${{ inputs.preview_name }}")
        fi
        npx dotenvx run -f "${{ inputs.dotenv_file }}" -- npx convex deploy \
          "${extra[@]}" \
          --cmd-url-env-var-name VITE_CONVEX_URL \
          --cmd 'echo "CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV" && npm run cf:build'

    - name: Deploy Cloudflare
      id: cf
      shell: bash
      run: |
        set -o pipefail
        site_url="${CONVEX_URL:-}"
        if [ -n "$site_url" ]; then
          site_url="${site_url%.convex.cloud}.convex.site"
        fi
        extra=()
        if [ -n "$site_url" ]; then
          extra+=(--var "CONVEX_SITE_URL:${site_url}")
        fi
        set +e
        npx dotenvx run -f "${{ inputs.dotenv_file }}" -- npx wrangler ${{ inputs.wrangler_args }} \
          "${extra[@]}" \
          | tee /tmp/wrangler.out
        status=${PIPESTATUS[0]}
        set -e
        if [ "$status" -ne 0 ]; then
          if grep -q "does not yet exist" /tmp/wrangler.out; then
            echo "Named Worker is missing; deploying once so versions upload can target it."
            bootstrap=()
            if [ "${{ inputs.name }}" != "production" ]; then
              bootstrap+=(--env "${{ inputs.name }}")
            fi
            npx dotenvx run -f "${{ inputs.dotenv_file }}" -- npx wrangler deploy \
              "${bootstrap[@]}" \
              "${extra[@]}"
            npx dotenvx run -f "${{ inputs.dotenv_file }}" -- npx wrangler ${{ inputs.wrangler_args }} \
              "${extra[@]}" \
              | tee /tmp/wrangler.out
          else
            exit "$status"
          fi
        fi
        node scripts/extract-preview-url.mjs < /tmp/wrangler.out

    # Validates JWT_PRIVATE_KEY / JWKS with jose, repairs dotenv escaping and
    # derives the JWKS from the private key when the provided one is unusable.
    # A JWKS pushed verbatim with escaped quotes served invalid JSON and broke
    # every sign-in (AuthProviderDiscoveryFailed) on production and staging.
    - name: Point Convex Auth at the Worker
      shell: bash
      env:
        SITE_URL: ${{ steps.cf.outputs.cloudflare_url }}
        CONVEX_ENV_ARGS: ${{ inputs.convex_env_extra }}
      run: |
        npx dotenvx run -f "${{ inputs.dotenv_file }}" -- node scripts/sync-convex-auth-env.mjs

    - name: Show deploy URLs
      shell: bash
      env:
        CLOUDFLARE_URL: ${{ steps.cf.outputs.cloudflare_url }}
      run: node scripts/write-deploy-summary.mjs ${{ inputs.name }}
