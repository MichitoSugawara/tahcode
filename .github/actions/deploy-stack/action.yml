name: Deploy stack
description: Decrypt env, deploy Convex and Cloudflare, then sync Convex Auth env

inputs:
  name:
    required: true
    description: preview, staging, or production
  dotenv_file:
    required: true
  wrangler_args:
    required: true
    description: Arguments after wrangler, e.g. deploy --env staging
  preview_name:
    required: false
    default: ""
  preview_fallbacks:
    required: false
    default: ""
    description: Comma-separated Convex preview names to reuse when the preferred name hits DeploymentQuotaReached
  preview_exclude:
    required: false
    default: ""
    description: Comma-separated preview names owned by other open PRs (never steal)
  preview_prune:
    required: false
    default: ""
    description: Comma-separated stale preview names (closed/merged branches) to delete when quota blocks pr-N
  convex_env_extra:
    required: false
    default: ""
    description: Deployment selector for convex env set, e.g. --prod or --preview-name foo (--deployment is rejected when CONVEX_DEPLOY_KEY is set)
  public_site_url:
    required: false
    default: ""
    description: >
      Public origin for Convex Auth SITE_URL (OAuth return URL). Invariant: the custom domain is the OAuth return URL; workers.dev is only the Worker hostname. Production defaults to https://tahcode.com and fail-closes if SITE_URL is workers.dev. Staging/preview keep the wrangler workers.dev / preview-alias URL. Override with this input or PUBLIC_SITE_URL.

outputs:
  cloudflare_url:
    description: Deployed Cloudflare workers.dev / preview-alias URL
    value: ${{ steps.cf.outputs.cloudflare_url }}
  public_site_url:
    description: Public site URL used for Convex Auth SITE_URL
    value: ${{ steps.cf.outputs.public_site_url }}
  skipped:
    description: true when preview Cloudflare deploy was skipped
    value: ${{ steps.cf.outputs.skipped }}
  skip_reason:
    description: Why preview Cloudflare deploy was skipped
    value: ${{ steps.cf.outputs.skip_reason }}
  convex_preview_name:
    description: Convex preview identifier that was actually claimed
    value: ${{ steps.convex.outputs.preview_name }}

runs:
  using: composite
  steps:
    - name: Decrypt env
      shell: bash
      run: node scripts/env.mjs decrypt ${{ inputs.name }}

    - name: Mask decrypted secrets
      shell: bash
      run: node scripts/mask-env.mjs ${{ inputs.dotenv_file }}

    - name: Ensure preview R2 bucket
      if: ${{ inputs.name == 'preview' }}
      shell: bash
      run: |
        node scripts/ensure-r2-bucket.mjs \
          --bucket team-harness-files-preview \
          --dotenv "${{ inputs.dotenv_file }}"

    - name: Deploy Convex and build the Worker
      id: convex
      shell: bash
      run: |
        if [ "${{ inputs.name }}" = "preview" ] && [ -n "${{ inputs.preview_name }}" ]; then
          # Unique per-branch preview names filled the team quota (40).
          # Prefer pr-<n>. On quota, delete a stale leftover then retry pr-<n>
          # so this PR does not share Convex with every other open PR.
          node scripts/convex-preview-deploy.mjs \
            --dotenv "${{ inputs.dotenv_file }}" \
            --preview-name "${{ inputs.preview_name }}" \
            --fallback-names "${{ inputs.preview_fallbacks }}" \
            --exclude-names "${{ inputs.preview_exclude }}" \
            --prune-names "${{ inputs.preview_prune }}"
        else
          extra=()
          if [ -n "${{ inputs.preview_name }}" ]; then
            extra+=(--preview-name "${{ inputs.preview_name }}")
          fi
          npx dotenvx run -f "${{ inputs.dotenv_file }}" -- npx convex deploy \
            "${extra[@]}" \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --cmd 'echo "CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV" && npm run cf:build'
        fi

    - name: Deploy Cloudflare
      id: cf
      shell: bash
      env:
        PUBLIC_SITE_URL: ${{ inputs.public_site_url }}
      run: |
        # Preview: retry transient `fetch failed` / connectivity with backoff,
        # bootstrap a missing Worker, create the preview R2 bucket if needed.
        # Staging/production: one attempt + existing Worker-missing bootstrap.
        # Combined stdout/stderr is saved so classification sees stderr too.
        node scripts/wrangler-deploy.mjs \
          --name "${{ inputs.name }}" \
          --dotenv "${{ inputs.dotenv_file }}" \
          --output /tmp/wrangler.out \
          -- \
          ${{ inputs.wrangler_args }}

    # Invariant: Convex Auth SITE_URL is the public OAuth return origin
    # (production → https://tahcode.com). wrangler workers.dev is only the
    # Worker hostname and must never be written as SITE_URL on production.
    # sync-convex-auth-env.mjs fail-closes if production SITE_URL is
    # workers.dev or does not match the configured public origin, then
    # reads the value back from Convex.
    # Also validates JWT_PRIVATE_KEY / JWKS with jose (a JWKS pushed
    # verbatim with escaped quotes once served invalid JSON and broke
    # every sign-in via AuthProviderDiscoveryFailed).
    - name: Point Convex Auth at the public site
      if: ${{ steps.cf.outputs.skipped != 'true' }}
      shell: bash
      env:
        DEPLOY_NAME: ${{ inputs.name }}
        SITE_URL: ${{ steps.cf.outputs.public_site_url }}
        PUBLIC_SITE_URL: ${{ steps.cf.outputs.public_site_url }}
        CONVEX_ENV_ARGS: ${{ steps.convex.outputs.preview_name != '' && format('--preview-name {0}', steps.convex.outputs.preview_name) || inputs.convex_env_extra }}
      run: |
        npx dotenvx run -f "${{ inputs.dotenv_file }}" -- node scripts/sync-convex-auth-env.mjs

    # Preview/staging only. Google OAuth is not registered on ephemeral
    # preview hosts, so every preview must have a password user. The script
    # fail-closes on production / --prod and never runs in the production job.
    - name: Seed preview login
      if: ${{ inputs.name == 'preview' || inputs.name == 'staging' }}
      shell: bash
      env:
        DEPLOY_NAME: ${{ inputs.name }}
        CONVEX_ENV_ARGS: ${{ steps.convex.outputs.preview_name != '' && format('--preview-name {0}', steps.convex.outputs.preview_name) || inputs.convex_env_extra }}
      run: |
        npx dotenvx run -f "${{ inputs.dotenv_file }}" -- node scripts/seed-preview-login.mjs

    - name: Show deploy URLs
      shell: bash
      env:
        CLOUDFLARE_URL: ${{ steps.cf.outputs.cloudflare_url }}
        PUBLIC_SITE_URL: ${{ steps.cf.outputs.public_site_url }}
      run: node scripts/write-deploy-summary.mjs ${{ inputs.name }}
