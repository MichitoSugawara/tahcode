name: Deploy stack
description: Decrypt env, deploy Convex and Cloudflare, then sync Convex Auth env

inputs:
  name:
    required: true
    description: preview, staging, or production
  dotenv_file:
    required: true
  wrangler_args:
    required: true
    description: Arguments after wrangler, e.g. deploy --env staging
  preview_name:
    required: false
    default: ""
  preview_fallbacks:
    required: false
    default: ""
    description: Comma-separated Convex preview names to reuse when the preferred name hits DeploymentQuotaReached
  preview_exclude:
    required: false
    default: ""
    description: Comma-separated preview names owned by other open PRs (never steal)
  convex_env_extra:
    required: false
    default: ""
    description: Deployment selector for convex env set, e.g. --prod or --preview-name foo (--deployment is rejected when CONVEX_DEPLOY_KEY is set)

outputs:
  cloudflare_url:
    description: Deployed Cloudflare URL
    value: ${{ steps.cf.outputs.cloudflare_url }}
  skipped:
    description: true when preview Cloudflare deploy was skipped
    value: ${{ steps.cf.outputs.skipped }}
  skip_reason:
    description: Why preview Cloudflare deploy was skipped
    value: ${{ steps.cf.outputs.skip_reason }}
  convex_preview_name:
    description: Convex preview identifier that was actually claimed
    value: ${{ steps.convex.outputs.preview_name }}

runs:
  using: composite
  steps:
    - name: Decrypt env
      shell: bash
      run: node scripts/env.mjs decrypt ${{ inputs.name }}

    - name: Mask decrypted secrets
      shell: bash
      run: node scripts/mask-env.mjs ${{ inputs.dotenv_file }}

    - name: Ensure preview R2 bucket
      if: ${{ inputs.name == 'preview' }}
      shell: bash
      run: |
        node scripts/ensure-r2-bucket.mjs \
          --bucket team-harness-files-preview \
          --dotenv "${{ inputs.dotenv_file }}"

    - name: Deploy Convex and build the Worker
      id: convex
      shell: bash
      run: |
        if [ "${{ inputs.name }}" = "preview" ] && [ -n "${{ inputs.preview_name }}" ]; then
          # Unique per-branch preview names filled the team quota (40).
          # Prefer pr-<n>; on DeploymentQuotaReached reuse an existing name.
          node scripts/convex-preview-deploy.mjs \
            --dotenv "${{ inputs.dotenv_file }}" \
            --preview-name "${{ inputs.preview_name }}" \
            --fallback-names "${{ inputs.preview_fallbacks }}" \
            --exclude-names "${{ inputs.preview_exclude }}"
        else
          extra=()
          if [ -n "${{ inputs.preview_name }}" ]; then
            extra+=(--preview-name "${{ inputs.preview_name }}")
          fi
          npx dotenvx run -f "${{ inputs.dotenv_file }}" -- npx convex deploy \
            "${extra[@]}" \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --cmd 'echo "CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV" && npm run cf:build'
        fi

    - name: Deploy Cloudflare
      id: cf
      shell: bash
      run: |
        # Preview: retry transient `fetch failed` / connectivity with backoff,
        # bootstrap a missing Worker, create the preview R2 bucket if needed.
        # Staging/production: one attempt + existing Worker-missing bootstrap.
        # Combined stdout/stderr is saved so classification sees stderr too.
        node scripts/wrangler-deploy.mjs \
          --name "${{ inputs.name }}" \
          --dotenv "${{ inputs.dotenv_file }}" \
          --output /tmp/wrangler.out \
          -- \
          ${{ inputs.wrangler_args }}

    # Validates JWT_PRIVATE_KEY / JWKS with jose, repairs dotenv escaping and
    # derives the JWKS from the private key when the provided one is unusable.
    # A JWKS pushed verbatim with escaped quotes served invalid JSON and broke
    # every sign-in (AuthProviderDiscoveryFailed) on production and staging.
    - name: Point Convex Auth at the Worker
      if: ${{ steps.cf.outputs.skipped != 'true' }}
      shell: bash
      env:
        SITE_URL: ${{ steps.cf.outputs.cloudflare_url }}
        CONVEX_ENV_ARGS: ${{ steps.convex.outputs.preview_name != '' && format('--preview-name {0}', steps.convex.outputs.preview_name) || inputs.convex_env_extra }}
      run: |
        npx dotenvx run -f "${{ inputs.dotenv_file }}" -- node scripts/sync-convex-auth-env.mjs

    - name: Show deploy URLs
      shell: bash
      env:
        CLOUDFLARE_URL: ${{ steps.cf.outputs.cloudflare_url }}
      run: node scripts/write-deploy-summary.mjs ${{ inputs.name }}
