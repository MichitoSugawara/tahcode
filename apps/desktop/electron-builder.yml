# electron-builder configuration for the tahcode desktop shell.
# Build on a Mac: `npm run dist` (Apple Silicon .dmg + .zip in release/).
# Signing / notarization are intentionally off for now — see README.md.
appId: com.tahcode.desktop
productName: tahcode
copyright: Copyright © 2026 tahcode
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!out/**/*.map"
  # electron-vite inlines everything the shell needs (including @tahcode/core);
  # never ship node_modules — in an npm workspace the hoisted root tree would be picked up.
  - "!node_modules/**/*"

asar: true
npmRebuild: false

# Registers tahcode:// so the system browser can hand the OAuth code back to
# the app (CFBundleURLTypes on macOS; .desktop MimeType on Linux).
protocols:
  - name: tahcode
    schemes:
      - tahcode

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  darkModeSupport: true
  # Unsigned for now. Remove `identity: null` and add APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID (+ a Developer ID certificate in the keychain) to sign and notarize.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHighResolutionCapable: true
    LSMinimumSystemVersion: "12.0"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  sign: false
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

linux:
  category: Development
  icon: build/icon.png
  executableName: tahcode
  # `dir` only: Linux is used for CI smoke tests, not for distribution.
  target:
    - dir

# GitHub Releases are the feed for desktop-v* tags. CI publishes only on those
# tags (see .github/workflows/desktop.yml). workflow_dispatch stays artifact-only.
# In-app replace still waits for Developer ID + notarization; unsigned builds
# download the .dmg and ask the user to copy it into Applications.
publish:
  provider: github
  owner: MichitoSugawara
  repo: tahcode
  releaseType: release
  vPrefixedTagName: false
