# electron-builder configuration for the tahcode desktop shell.
# Build on a Mac: `npm run dist:mac` (unsigned Apple Silicon .dmg + .zip)
# or `npm run dist:mac:signed` (Developer ID + notarize when env is set).
#
# Signing / notarization are selected at build time — do not pin
# `mac.identity: null` here. Unsigned scripts pass -c.mac.identity=null
# (see scripts/desktop-signing.mjs). Signed builds leave identity unset so
# electron-builder discovers Developer ID from CSC_LINK / the keychain.
# @see https://www.electron.build/code-signing
# @see https://www.electron.build/mac
appId: com.tahcode.desktop
productName: tahcode
copyright: Copyright © 2026 tahcode
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!out/**/*.map"
  # electron-vite inlines everything the shell needs (including @tahcode/core);
  # never ship node_modules — in an npm workspace the hoisted root tree would be picked up.
  - "!node_modules/**/*"

asar: true
npmRebuild: false

# Registers tahcode:// so the system browser can hand the OAuth code back to
# the app (CFBundleURLTypes on macOS; .desktop MimeType on Linux).
protocols:
  - name: tahcode
    schemes:
      - tahcode

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  darkModeSupport: true
  # identity is intentionally omitted. Unsigned: scripts set it to null.
  # Signed: CSC_IDENTITY_AUTO_DISCOVERY=true + CSC_LINK / keychain.
  hardenedRuntime: true
  gatekeeperAssess: false
  # @electron/notarize runs only when Apple credentials are in the environment
  # (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, or an App Store
  # Connect API key). Unsigned scripts force this off with -c.mac.notarize=false.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHighResolutionCapable: true
    LSMinimumSystemVersion: "12.0"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  # Default unsigned. Signed scripts pass -c.dmg.sign=true.
  # electron-builder notes DMG signing can conflict with notarization; we still
  # enable it for signed distribution so the disk image matches the .app.
  sign: false
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

linux:
  category: Development
  icon: build/icon.png
  executableName: tahcode
  # `dir` only: Linux is used for CI smoke tests, not for distribution.
  target:
    - dir

# GitHub Releases are the feed for desktop-v* tags. CI publishes only on those
# tags (see .github/workflows/desktop.yml). workflow_dispatch stays artifact-only.
# Signed+notarized builds set TAHCODE_DESKTOP_SIGNED=1 so the in-app updater
# can offer quitAndInstall. Unsigned builds download the .dmg and ask the user
# to copy it into Applications.
publish:
  provider: github
  owner: MichitoSugawara
  repo: tahcode
  releaseType: release
  vPrefixedTagName: false
